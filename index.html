<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Medieval RPG - Top Down</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-overlay">
            <!-- Верхняя панель -->
            <div id="top-bar">
                <div id="stats">
                    <div id="health-container">
                        <div id="health-icon">❤️</div>
                        <div id="health-bar">
                            <div id="health-fill"></div>
                        </div>
                        <span id="health-text">100/100</span>
                    </div>
                    <div id="gold-display">🪙 100</div>
                    <div id="level-display">⚔️ Ур.1</div>
                </div>
                <div id="mini-map">
                    <canvas id="miniMapCanvas"></canvas>
                </div>
            </div>
            
            <!-- Диалоговое окно -->
            <div id="dialogue-box" style="display:none;">
                <div id="dialogue-portrait">👤</div>
                <div id="dialogue-content">
                    <div id="dialogue-name">NPC</div>
                    <p id="dialogue-text"></p>
                </div>
                <button id="dialogue-close">✕</button>
            </div>
            
            <!-- Панель взаимодействия -->
            <div id="interaction-panel" style="display:none;">
                <button id="talk-btn">💬</button>
                <button id="trade-btn">🛒</button>
                <button id="quest-btn">📜</button>
            </div>
            
            <!-- Управление -->
            <div id="controls">
                <!-- Левая рука - движение -->
                <div id="joystick-area">
                    <div id="joystick"></div>
                </div>
                
                <!-- Правая рука - действия -->
                <div id="action-buttons">
                    <button id="action-btn">⚔️</button>
                    <button id="interact-btn">👆</button>
                </div>
            </div>
        </div>
    </div>
    
    <script type="importmap">
        {
            "imports": {
                "./modules/": "./modules/"
            }
        }
    </script>
    <script type="module" src="game.js"></script>
</body>
</html>
